server {
    # Signed OpenSearch PIT cursors can exceed the default 8k request-line buffer.
    # Still bounded, and upstream Node is explicitly capped at 64k in the opt-in profile.
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # API proxy to backend
    client_max_body_size 51m;

    # Local operations only exist on the separate loopback listener (8091).
    # Do not turn management-looking URLs into successful public SPA responses.
    location = /ops-api { return 404; }
    location ^~ /ops-api/ { return 404; }

    # Uploaded files (avatars, etc.)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Timeout for agent-stream (multi-turn tool calls can be slow)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # SSE support for chat streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets with long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
