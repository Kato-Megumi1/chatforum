name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PAGES: 'false'
          VITE_BASE_PATH: /chatforum/
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: chatforum-test-only
          MYSQL_DATABASE: chatforum_test
        ports: ['33316:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=3s --health-retries=40
      redis:
        image: redis:7-alpine
        ports: ['36386:6379']
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ['36336:6333']
    env:
      DATABASE_URL: mysql://root:chatforum-test-only@127.0.0.1:33316/chatforum_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '36386'
      QDRANT_URL: http://127.0.0.1:36336
      JWT_ACCESS_SECRET: integration-test-access-secret-at-least-32
      JWT_REFRESH_SECRET: integration-test-refresh-secret-at-least-32
      RUN_RAG_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: backend
      - run: npx prisma generate && npx prisma migrate deploy
        working-directory: backend
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm run build
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
